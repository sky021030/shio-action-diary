<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd633"><title>しおくんのアクション日記</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#27304a;background:linear-gradient(145deg,#fff6a9,#d9f8ff 54%,#f6deff);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{width:min(560px,100%);margin:auto;padding:20px 14px 54px}header{text-align:center}.tag{display:inline-block;padding:6px 13px;border:2px solid #27304a;border-radius:99px;background:#fff;box-shadow:3px 3px 0 #27304a;font-weight:900;font-size:.72rem}.ham{font-size:4rem;margin:5px 0 -12px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px) rotate(5deg)}}h1{margin:0;color:#ff6576;font-size:clamp(2rem,10vw,3.35rem);letter-spacing:-.06em;text-shadow:2px 2px #fff,4px 4px #27304a}header p{font-weight:900;color:#66728b}.card{margin-top:16px;padding:20px 16px;border:3px solid #27304a;border-radius:28px;background:#fffffff0;box-shadow:7px 8px 0 #27304a}.privacy{padding:10px 12px;border-radius:14px;background:#fff3ae;color:#5d536c;font-size:.78rem;font-weight:900}.label{display:flex;justify-content:space-between;gap:10px;font-weight:900;margin:15px 0 9px}.count{color:#778198;font-size:.8rem}textarea{width:100%;min-height:150px;border:3px solid #27304a;border-radius:20px;padding:16px;background:#fffdf5;color:#27304a;font:700 1.05rem/1.65 inherit;resize:vertical;user-select:text}textarea:focus,input:focus{outline:5px solid #67dded;outline-offset:2px}.surprise{text-align:center;margin:14px 0 0;color:#6e7890;font-weight:900}.post{width:100%;min-height:66px;margin-top:14px;border:3px solid #27304a;border-radius:20px;background:linear-gradient(110deg,#ff6476,#ffa23e);box-shadow:0 6px 0 #27304a;color:#fff;font:900 1.15rem inherit}.post:active,.unlock button:active{transform:translateY(5px);box-shadow:0 1px 0 #27304a}.message{min-height:1.5em;margin:16px 0 0;text-align:center;color:#ed4f67;font-weight:900}.history{display:grid;gap:12px;margin-top:18px}.entry{padding:16px;border:2px solid #27304a;border-radius:19px;background:#fff;box-shadow:4px 4px 0 #27304a;animation:pop .25s ease-out}.entry:nth-child(3n+2){background:#fff8c8}.entry:nth-child(3n){background:#e4faff}.entry-head{display:flex;justify-content:space-between}.entry-effect{font-size:1.55rem}.date{color:#7a849a;font-size:.72rem;font-weight:800}.entry p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:700;line-height:1.6}.empty{text-align:center;padding:24px;color:#788299;font-weight:800}.note{text-align:center;margin:21px 4px 0;color:#788299;font-size:.72rem;font-weight:800}.lock{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:18px;background:#27304acc;backdrop-filter:blur(8px)}.lock[hidden]{display:none}.unlock{width:min(430px,100%);padding:25px 18px;border:3px solid #27304a;border-radius:28px;background:#fffdf5;box-shadow:8px 9px 0 #27304a;text-align:center}.unlock h2{margin:10px 0 8px}.unlock p{font-weight:800;color:#66728b}.unlock input{width:100%;min-height:56px;border:3px solid #27304a;border-radius:16px;padding:10px 14px;font:800 1rem inherit}.unlock button{width:100%;min-height:56px;margin-top:12px;border:3px solid #27304a;border-radius:16px;background:#ffd633;box-shadow:0 5px 0 #27304a;font:900 1rem inherit}.actor{position:fixed;z-index:50;pointer-events:none;animation:burst 1.15s cubic-bezier(.2,.75,.3,1) forwards}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.3) rotate(var(--r));opacity:0}}.flash{position:fixed;z-index:45;inset:0;pointer-events:none;background:#fff06a;animation:flash .6s ease-out forwards}@keyframes flash{0%,35%{opacity:.9}18%,55%,100%{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
</style></head><body><div class="lock" id="lock"><form class="unlock" id="unlock"><div class="ham">🐹</div><h2>かぞくの あいことば</h2><p>ママとしおくんだけの日記だよ</p><input id="password" type="password" autocomplete="current-password" required aria-label="あいことば"><button type="submit">🔓 ひらく</button><p class="message" id="lockMessage" role="status"></p></form></div><main><header><span class="tag">SHIO'S MINI APP</span><div class="ham">🐹</div><h1>アクション日記</h1><p>かいて、とうこう、なにがでるかな？</p></header><section class="card"><p class="privacy">🛡️ おなまえ・がっこう・おうちのばしょは かかないでね</p><label class="label" for="text">きょうのことを かこう！ <span class="count"><b id="count">0</b>/100</span></label><textarea id="text" maxlength="100" placeholder="きょう たのしかったことは？"></textarea><p class="surprise">🐹 ⚡ 🌈 とうこうしたら おたのしみ！</p><button class="post" id="post">🚀 とうこうする！</button><p class="message" id="message" role="status"></p><div class="history" id="history"></div></section><p class="note">日記は合言葉で守られた家族用クラウドに保存します。</p></main><script>
const text=document.querySelector('#text'),message=document.querySelector('#message'),kinds=['hamster','thunder','rainbow'];let entries=[],password='';text.addEventListener('input',()=>document.querySelector('#count').textContent=text.value.length);const icon=e=>e==='hamster'?'🐹':e==='thunder'?'⚡':'🌈';function render(){const box=document.querySelector('#history');box.replaceChildren();if(!entries.length){box.innerHTML='<div class="empty">まだ日記はないよ。さいしょの1こを書こう！</div>';return}entries.forEach(item=>{const card=document.createElement('article');card.className='entry';const head=document.createElement('div');head.className='entry-head';const stamp=document.createElement('div');stamp.className='entry-effect';stamp.textContent=icon(item.effect);const date=document.createElement('div');date.className='date';date.textContent=new Date(item.created_at).toLocaleString('ja-JP',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});const body=document.createElement('p');body.textContent=item.body;head.append(stamp,date);card.append(head,body);box.append(card)})}async function api(action,data={}){const r=await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password,...data})}),v=await r.json();if(!r.ok)throw new Error(v.error||'つうしんに しっぱいしました');return v.entries}function burst(kind){if(kind==='thunder'){const f=document.createElement('div');f.className='flash';document.body.append(f);setTimeout(()=>f.remove(),700)}const icons=kind==='hamster'?['🐹','🐹','🐹','🌻']:kind==='thunder'?['⚡','⚡','🌩️','💥']:['🌈','⭐','✨','🌟'];for(let i=0;i<24;i++){const a=document.createElement('i');a.className='actor';a.textContent=icons[i%icons.length];a.style.left=20+Math.random()*60+'vw';a.style.top=25+Math.random()*45+'vh';a.style.fontSize=24+Math.random()*34+'px';a.style.setProperty('--x',(Math.random()-.5)*280+'px');a.style.setProperty('--y',(Math.random()-.5)*360+'px');a.style.setProperty('--r',Math.random()*500-250+'deg');document.body.append(a);a.addEventListener('animationend',()=>a.remove())}}document.querySelector('#unlock').addEventListener('submit',async e=>{e.preventDefault();password=document.querySelector('#password').value;const m=document.querySelector('#lockMessage');m.textContent='よみこみ中…';try{entries=await api('list');document.querySelector('#lock').hidden=true;render()}catch(err){password='';m.textContent=err.message}});document.querySelector('#post').addEventListener('click',async()=>{const body=text.value.trim();if(!body){message.textContent='日記をかいてね！';return text.focus()}const effect=kinds[Math.floor(Math.random()*kinds.length)];message.textContent='ほぞん中…';try{entries=await api('record',{body,effect});text.value='';document.querySelector('#count').textContent='0';message.textContent='とうこう できたよ！';render();burst(effect)}catch(err){message.textContent=err.message}});render();
</script></body></html>
