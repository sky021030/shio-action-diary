<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd633"><title>しおくんのアクション日記</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#27304a;background:linear-gradient(145deg,#fff6a9,#d9f8ff 54%,#f6deff);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{width:min(560px,100%);margin:auto;padding:20px 14px 54px}header{text-align:center}.tag{display:inline-block;padding:6px 13px;border:2px solid #27304a;border-radius:99px;background:#fff;box-shadow:3px 3px 0 #27304a;font-weight:900;font-size:.72rem}.ham{font-size:4rem;margin:5px 0 -12px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px) rotate(5deg)}}h1{margin:0;color:#ff6576;font-size:clamp(2rem,10vw,3.35rem);letter-spacing:-.06em;text-shadow:2px 2px #fff,4px 4px #27304a}header p{font-weight:900;color:#66728b}.vip{display:inline-block;margin:0 0 10px;padding:8px 22px;border:4px solid #27304a;border-radius:18px;background:linear-gradient(120deg,#ffd633,#ff8bd4,#67dded);box-shadow:6px 6px 0 #27304a;color:#fff;font-size:clamp(2.5rem,14vw,5rem);font-weight:1000;letter-spacing:.08em;text-shadow:3px 3px 0 #27304a;animation:vipPop .8s cubic-bezier(.2,1.6,.4,1)}.vip[hidden]{display:none}@keyframes vipPop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}.card{margin-top:16px;padding:20px 16px;border:3px solid #27304a;border-radius:28px;background:#fffffff0;box-shadow:7px 8px 0 #27304a}.privacy{padding:10px 12px;border-radius:14px;background:#fff3ae;color:#5d536c;font-size:.78rem;font-weight:900}.label{display:flex;justify-content:space-between;gap:10px;font-weight:900;margin:15px 0 9px}.count{color:#778198;font-size:.8rem}textarea{width:100%;min-height:150px;border:3px solid #27304a;border-radius:20px;padding:16px;background:#fffdf5;color:#27304a;font:700 1.05rem/1.65 inherit;resize:vertical;user-select:text}textarea:focus,input:focus{outline:5px solid #67dded;outline-offset:2px}.who{margin:15px 0 4px}.who-title{font-weight:900;margin-bottom:8px}.emoji-search{width:100%;min-height:48px;border:2px solid #27304a;border-radius:14px;padding:9px 12px;font:800 .95rem inherit;background:#fff}.who-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-height:230px;overflow:auto;margin-top:9px;padding:4px}.who-grid button{display:grid;place-items:center;min-height:48px;border:2px solid #27304a;border-radius:13px;background:#fff;font-size:1.35rem;box-shadow:0 3px 0 #27304a}.who-grid button.selected{background:#ffd633;transform:translateY(3px);box-shadow:none}#chosen{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#ffd633}.surprise{text-align:center;margin:14px 0 0;color:#6e7890;font-weight:900}.post{width:100%;min-height:66px;margin-top:14px;border:3px solid #27304a;border-radius:20px;background:linear-gradient(110deg,#ff6476,#ffa23e);box-shadow:0 6px 0 #27304a;color:#fff;font:900 1.15rem inherit}.post:active,.unlock button:active{transform:translateY(5px);box-shadow:0 1px 0 #27304a}.message{min-height:1.5em;margin:16px 0 0;text-align:center;color:#ed4f67;font-weight:900}.history{display:grid;gap:12px;margin-top:18px}.entry{padding:16px;border:2px solid #27304a;border-radius:19px;background:#fff;box-shadow:4px 4px 0 #27304a;animation:pop .25s ease-out}.entry:nth-child(3n+2){background:#fff8c8}.entry:nth-child(3n){background:#e4faff}.entry-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.entry-effect{font-size:1.55rem}.meta{display:flex;align-items:center;gap:7px}.author{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#ffd633;font-size:1.2rem}.date{color:#7a849a;font-size:.72rem;font-weight:800}.delete-btn{border:0;padding:5px 7px;background:transparent;color:#9aa2b3;font:700 .68rem inherit}.delete-btn:active{color:#66728b}.entry p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:700;line-height:1.6}.empty{text-align:center;padding:24px;color:#788299;font-weight:800}.note{text-align:center;margin:21px 4px 0;color:#788299;font-size:.72rem;font-weight:800}.lock{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:18px;background:#27304acc;backdrop-filter:blur(8px)}.lock[hidden]{display:none}.unlock{width:min(430px,100%);padding:25px 18px;border:3px solid #27304a;border-radius:28px;background:#fffdf5;box-shadow:8px 9px 0 #27304a;text-align:center}.unlock h2{margin:10px 0 8px}.unlock p{font-weight:800;color:#66728b}.unlock input{width:100%;min-height:56px;border:3px solid #27304a;border-radius:16px;padding:10px 14px;font:800 1rem inherit;-webkit-text-security:disc}.unlock button{width:100%;min-height:56px;margin-top:12px;border:3px solid #27304a;border-radius:16px;background:#ffd633;box-shadow:0 5px 0 #27304a;font:900 1rem inherit}.actor{position:fixed;z-index:50;pointer-events:none;animation:burst 3.2s cubic-bezier(.2,.75,.3,1) forwards}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}12%{opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.5) rotate(var(--r));opacity:0}}.flash{position:fixed;z-index:45;inset:0;pointer-events:none;background:#fff06a;animation:flash .6s ease-out forwards}@keyframes flash{0%,35%{opacity:.9}18%,55%,100%{opacity:0}}body.shake main{animation:shake .12s 7}.boom-wave{position:fixed;z-index:48;width:80px;height:80px;border:16px solid #ff6b35;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:wave 1.8s ease-out forwards}@keyframes wave{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}100%{transform:translate(-50%,-50%) scale(7);opacity:0}}@keyframes shake{25%{transform:translate(8px,-5px) rotate(1deg)}75%{transform:translate(-8px,5px) rotate(-1deg)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
</style></head><body><div class="lock" id="lock"><form class="unlock" id="unlock"><div class="ham">🐹</div><h2>かぞくの あいことば</h2><p>ママとしおくんだけの日記だよ</p><input id="password" type="password" inputmode="numeric" pattern="[0-9]*" autocapitalize="none" spellcheck="false" autocomplete="off" required aria-label="あいことば"><button type="submit">🔓 ひらく</button><p class="message" id="lockMessage" role="status"></p></form></div><main><header><div class="vip" id="vip" hidden>✨ VIP ✨</div><br><span class="tag">SHIO'S MINI APP</span><div class="ham">🐹</div><h1>アクション日記</h1><p>かいて、とうこう、なにがでるかな？</p></header><section class="card"><p class="privacy">🛡️ おなまえ・がっこう・おうちのばしょは かかないでね</p><div class="who"><div class="who-title">じぶんの マークを えらんでね <span id="chosen">🪐</span></div><input class="emoji-search" id="emojiSearch" type="search" inputmode="search" placeholder="🔎 ちきゅう・ねこ・アイス…" aria-label="マークを検索"><input type="hidden" id="author" value="🪐"><div class="who-grid" id="emojiGrid"></div></div><label class="label" for="text">きょうのことを かこう！ <span class="count"><b id="count">0</b>/100</span></label><textarea id="text" maxlength="100" placeholder="きょう たのしかったことは？"></textarea><p class="surprise">🐹 ⚡ 🌈 💥 とうこうしたら おたのしみ！</p><button class="post" id="post">🚀 とうこうする！</button><p class="message" id="message" role="status"></p><div class="history" id="history"></div></section><p class="note">日記は合言葉で守られた家族用クラウドに保存します。</p></main><script>
const earthMarks=new Set(['🌍','🌎','🌏']);let canUseEarth=false;const emojiNames={"🌍":"地球 ちきゅう","🌎":"地球 アメリカ","🌏":"地球 アジア","🪐":"惑星 わくせい 土星","☀️":"太陽 たいよう","🌙":"月 つき","⭐":"星 ほし","🌈":"虹 にじ","🚀":"ロケット","🐱":"猫 ねこ","🐶":"犬 いぬ","🐹":"ハムスター ねずみ","🐭":"ねずみ","🍨":"アイス","🥞":"パンケーキ","🥚":"たまご","🍬":"おかし あめ"};const emojiList='🌍 🌎 🌏 🪐 ☀️ 🌙 ⭐ 🌟 🌈 ☄️ 🚀 🛸 👽 🤖 👾 🐱 🐶 🐹 🐭 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦉 🦄 🐝 🦋 🐌 🐞 🐢 🐙 🐬 🐳 🦖 🦕 🐲 🐉 🌸 🌻 🌵 🍀 🍄 🌊 🔥 ❄️ ⚡ 💧 🍎 🍊 🍋 🍉 🍇 🍓 🍒 🍑 🥝 🍅 🥕 🌽 🍞 🥐 🥞 🥚 🍔 🍕 🍙 🍣 🍜 🍦 🍨 🍩 🍪 🍬 🍭 🧁 🎂 ⚽ 🏀 🎸 🎹 🎨 🎮 🚗 🚲 ✈️ 🚁 🚂 🎈 🎁 💎 👑'.split(' ');function drawEmojis(q=''){const grid=document.querySelector('#emojiGrid'),word=q.trim().toLowerCase();grid.replaceChildren();emojiList.filter(e=>(canUseEarth||!earthMarks.has(e))&&(!word||e.includes(word)||(emojiNames[e]||'').includes(word))).forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.title=emojiNames[e]||'マーク';b.className=e===document.querySelector('#author').value?'selected':'';b.onclick=()=>{document.querySelector('#author').value=e;document.querySelector('#chosen').textContent=e;drawEmojis(document.querySelector('#emojiSearch').value)};grid.append(b)})}document.querySelector('#emojiSearch').addEventListener('input',e=>drawEmojis(e.target.value));drawEmojis();const text=document.querySelector('#text'),message=document.querySelector('#message'),kinds=['hamster','thunder','rainbow','boom'];let entries=[],password='';text.addEventListener('input',()=>document.querySelector('#count').textContent=text.value.length);const icon=e=>e==='hamster'?'🐹':e==='thunder'?'⚡':e==='boom'?'💥':'🌈',authorIcon=a=>a||'🌍';function render(){const box=document.querySelector('#history');box.replaceChildren();if(!entries.length){box.innerHTML='<div class="empty">まだ日記はないよ。さいしょの1こを書こう！</div>';return}[...entries].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(item=>{const card=document.createElement('article');card.className='entry';const head=document.createElement('div');head.className='entry-head';const meta=document.createElement('div');meta.className='meta';const author=document.createElement('span');author.className='author';author.textContent=authorIcon(item.author);const date=document.createElement('div');date.className='date';date.textContent=new Date(item.created_at).toLocaleString('ja-JP',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});const body=document.createElement('p');body.textContent=item.body;meta.append(author,date);const del=document.createElement('button');del.type='button';del.className='delete-btn';del.textContent='けす';del.setAttribute('aria-label','この日記を削除');del.onclick=async()=>{if(!confirm('この日記を削除しますか？'))return;del.disabled=true;message.textContent='削除中…';try{entries=await api('delete',{id:item.id});message.textContent='削除しました';render()}catch(err){del.disabled=false;message.textContent=err.message}};head.append(meta,del);card.append(head,body);box.append(card)})}async function api(action,data={}){const r=await fetch('/api/diary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password,...data})}),v=await r.json();if(!r.ok)throw new Error(v.error||'つうしんに しっぱいしました');canUseEarth=r.headers.get('X-Can-Use-Earth')==='1';document.querySelector('#vip').hidden=!canUseEarth;const author=document.querySelector('#author');if(!canUseEarth&&earthMarks.has(author.value)){author.value='🪐';document.querySelector('#chosen').textContent='🪐'}drawEmojis(document.querySelector('#emojiSearch').value);return v.entries}function sound(kind){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=kind==='boom'?'sawtooth':kind==='thunder'?'square':'sine';o.frequency.setValueAtTime(kind==='boom'?95:kind==='thunder'?150:520,c.currentTime);o.frequency.exponentialRampToValueAtTime(kind==='boom'?35:kind==='thunder'?70:760,c.currentTime+.45);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.55);o.start();o.stop(c.currentTime+.55)}catch(e){}}function burst(kind){sound(kind);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),900);if(kind==='thunder'){for(let n=0;n<3;n++)setTimeout(()=>{const f=document.createElement('div');f.className='flash';document.body.append(f);setTimeout(()=>f.remove(),700)},n*350)}if(kind==='boom'){for(let n=0;n<6;n++)setTimeout(()=>{const b=document.createElement('div');b.className='boom-wave';b.style.left=15+Math.random()*70+'vw';b.style.top=20+Math.random()*55+'vh';document.body.append(b);setTimeout(()=>b.remove(),1800)},n*220)}const icons=kind==='hamster'?['🐭','🐭','🐭','🧀']:kind==='thunder'?['⚡','⚡','🌩️','💥']:kind==='rainbow'?['🌈','⭐','✨','🌟']:['💥','🔥','✨','🟠'];for(let i=0;i<60;i++){const a=document.createElement('i');a.className='actor';a.textContent=icons[i%icons.length];a.style.left=5+Math.random()*90+'vw';a.style.top=10+Math.random()*75+'vh';a.style.fontSize=28+Math.random()*46+'px';a.style.animationDelay=Math.random()*.7+'s';a.style.setProperty('--x',(Math.random()-.5)*520+'px');a.style.setProperty('--y',(Math.random()-.5)*680+'px');a.style.setProperty('--r',Math.random()*500-250+'deg');document.body.append(a);a.addEventListener('animationend',()=>a.remove())}}document.querySelector('#unlock').addEventListener('submit',async e=>{e.preventDefault();password=document.querySelector('#password').value;const m=document.querySelector('#lockMessage');m.textContent='よみこみ中…';try{entries=await api('list');if(canUseEarth){document.querySelector('#author').value='🌍';document.querySelector('#chosen').textContent='🌍';drawEmojis(document.querySelector('#emojiSearch').value)}document.querySelector('#lock').hidden=true;render()}catch(err){password='';m.textContent=err.message}});document.querySelector('#post').addEventListener('click',async()=>{const body=text.value.trim(),author=document.querySelector('#author').value;if(!body){message.textContent='日記をかいてね！';return text.focus()}const effect=kinds[Math.floor(Math.random()*kinds.length)];message.textContent='ほぞん中…';try{entries=await api('record',{body,effect,author});text.value='';document.querySelector('#count').textContent='0';message.textContent='とうこう できたよ！';render();burst(effect)}catch(err){message.textContent=err.message}});render();
</script></body></html>
